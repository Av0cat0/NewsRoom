poll_minutes: 10
digest_hour: 8
timezone: Asia/Jerusalem
db_path: newsroom.db
max_age_hours: 24          # ignore articles older than this when alerting
bootstrap_silent: true     # first run records existing articles without emailing them
quiet_hours: {start: 23, end: 7}   # non-watchlist alerts are held for the digest; remove to disable

thresholds:
  instant: 85              # score >= this -> immediate email
  watchlist_instant: 50    # lower bar when a watchlist name matches
  digest: 50               # score >= this -> daily digest

# Multipliers per event type (tune to your strategy, e.g. raise distress for turnaround investing)
event_weights:
  exit_acquisition: 1.0
  ipo: 1.0
  public_offering: 1.0
  funding_round: 1.0
  market_entry: 1.0
  phase_change: 1.0
  distress: 1.0
  vc_fund: 1.0

# Companies / VCs / sectors you care about (case-insensitive substring match, Hebrew or English)
watchlist:
  - Wiz
  - Cato Networks
  - Check Point
  - CyberArk
  - Monday.com
  - NICE
  - Viola
  - Pitango
  - ויז
  - צ'ק פוינט

sources:
  # Verified working feeds (checked 2026-11-18)
  - {name: Globes (HE),       url: "https://www.globes.co.il/webservice/rss/rssfeeder.asmx/FeederNode?iID=594", credibility: 1.0, general: true}
  - {name: Geektime,          url: "https://www.geektime.co.il/feed/", credibility: 0.95}
  - {name: Times of Israel Tech, url: "https://www.timesofisrael.com/tech-israel/feed/", credibility: 1.0}
  - {name: Techtime,          url: "https://techtime.news/feed/", credibility: 0.9}
  - {name: Ynet,              url: "https://www.ynet.co.il/Integration/StoryRss2.xml", credibility: 0.9, general: true}
  - {name: TheMarker (GNews), url: "https://news.google.com/rss/search?q=site:themarker.com+%D7%94%D7%99%D7%99%D7%98%D7%A7+when:1d&hl=he&gl=IL&ceid=IL:he", credibility: 1.0, general: true}
  - {name: Israel Hayom,      url: "https://www.israelhayom.co.il/rss.xml", credibility: 0.85, general: true}
  # Direct feeds blocked/404 for plain clients -> read via public Google News RSS instead
  - {name: Calcalist/CTech (GNews), url: "https://news.google.com/rss/search?q=site:calcalistech.com+when:1d&hl=en-IL&gl=IL&ceid=IL:en", credibility: 1.05}
  - {name: Calcalist HE (GNews),    url: "https://news.google.com/rss/search?q=site:calcalist.co.il+when:1d&hl=he&gl=IL&ceid=IL:he", credibility: 1.05, general: true}
  - {name: JPost (GNews),           url: "https://news.google.com/rss/search?q=site:jpost.com+Israel+startup+when:1d&hl=en-IL&gl=IL&ceid=IL:en", credibility: 0.9, general: true}
  - {name: NoCamels (GNews),        url: "https://news.google.com/rss/search?q=site:nocamels.com+when:2d&hl=en-IL&gl=IL&ceid=IL:en", credibility: 0.9}
  - {name: Israeli exits (GNews),   url: "https://news.google.com/rss/search?q=%D7%90%D7%A7%D7%96%D7%99%D7%98+OR+%D7%A8%D7%95%D7%9B%D7%A9%D7%AA+%D7%A1%D7%98%D7%90%D7%A8%D7%98%D7%90%D7%A4+when:1d&hl=he&gl=IL&ceid=IL:he", credibility: 0.85}
